# Ejecuta los tests en cada push y pull request.
# Al publicar un tag de versión (ej: v1.0) además compila el .exe y el instalador y los sube a GitHub Releases,
# y genera el .msix de Microsoft Store como artefacto de la ejecución.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Las notas de cada versión se escriben a mano en release-notes/<tag>.md (como v1.0.md).
      # Si faltan, se frena acá en vez de publicar el changelog automático de GitHub.
      - name: Verificar que existan las notas de la versión
        shell: pwsh
        run: |
          $notas = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path $notas)) { Write-Error "Faltan las notas de la versión: creá $notas antes de publicar el tag."; exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tools/build_exe.py --zip
      - name: Instalar Inno Setup si el runner no lo trae
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: python tools/build_installer.py
      # Nombres sin versión: la web puede enlazar siempre a .../releases/latest/download/ShinobiPDF-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShinobiPDF-Setup.exe
            dist/ShinobiPDF-Portable.zip
          body_path: release-notes/${{ github.ref_name }}.md
      # Paquete para Microsoft Store: se sube a mano a Partner Center (lo firma Microsoft), por eso no va al release.
      # Va después de publicar el release para que un error del MSIX no frene la descarga normal
      - run: python tools/build_msix.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShinobiPDF-msix
          path: dist/ShinobiPDF.msix
